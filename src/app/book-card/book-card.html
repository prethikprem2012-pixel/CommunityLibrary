<article class="fade-in flex h-full flex-col overflow-hidden rounded-2xl border border-stone-200 bg-white shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md">
  <div class="relative flex aspect-[4/5] w-full flex-col justify-between overflow-hidden p-5">
    <img
      [src]="book().coverUrl"
      [alt]="'Cover of ' + book().title"
      class="absolute inset-0 h-full w-full object-cover"
    />
    <div class="absolute inset-0" [class]="config().coverClass + ' opacity-55'"></div>
    <span class="relative self-start rounded-full bg-white/25 px-3 py-1 text-xs font-semibold text-white backdrop-blur-sm">
      {{ book().genre }}
    </span>
    <h3 class="relative text-xl font-extrabold leading-tight text-white drop-shadow-sm">{{ book().title }}</h3>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <p class="text-sm text-stone-500">by {{ book().author }}</p>
    <span
      class="inline-block w-fit rounded-full px-3 py-1 text-xs font-semibold"
      [class]="config().badgeClass"
    >{{ book().genre }}</span>
    <p class="line-clamp-2 text-sm leading-relaxed text-stone-600">{{ book().description }}</p>
    <p class="mt-auto pt-2 text-right text-xs font-medium text-stone-500">Shared by {{ book().ownerName }}</p>
    <div class="pt-1">
      <ng-content />
    </div>
  </div>
</article>
